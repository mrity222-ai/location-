<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocationSpoofer Admin - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f4f6fc;
            color: #1e293b;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient background glow shapes */
        .bg-shape-1 {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(244, 246, 252, 0) 70%);
            border-radius: 50%;
            z-index: 0;
        }
        .bg-shape-2 {
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, rgba(244, 246, 252, 0) 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
        }

        .login-container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
            overflow: hidden;
        }

        /* Left Column Vector Illustration */
        .illustration-col {
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            position: relative;
        }
        .illustration-img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Right Column Form Styling */
        .form-col {
            padding: 4rem 4.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome-title {
            font-size: 2.75rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.1;
            margin-bottom: 0.2rem;
            letter-spacing: -0.02em;
        }
        .welcome-subtitle {
            font-size: 2.6rem;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.15;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 2.25rem;
        }
        .brand-badge .lock-icon {
            font-size: 1.5rem;
        }

        .form-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .custom-input {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.85rem 1.15rem;
            font-size: 1rem;
            color: #1e293b;
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            outline: none;
        }
        .custom-input::placeholder {
            color: #94a3b8;
        }

        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.2s ease;
        }
        .password-toggle:hover {
            color: #2563eb;
        }

        .form-check-input {
            width: 1.15em;
            height: 1.15em;
            border-radius: 4px;
            border: 1.5px solid #cbd5e1;
            cursor: pointer;
        }
        .form-check-input:checked {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .form-check-label {
            font-size: 0.925rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
        }

        .forgot-link {
            font-size: 0.925rem;
            font-weight: 600;
            color: #2563eb;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .forgot-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .btn-login {
            background: #1d6bf3;
            border: none;
            border-radius: 12px;
            padding: 0.95rem 1.5rem;
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(29, 107, 243, 0.25);
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            background: #1557d0;
            box-shadow: 0 12px 24px rgba(29, 107, 243, 0.35);
            transform: translateY(-1px);
        }

        /* Modal styling */
        .modal-content {
            border-radius: 20px;
            border: none;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 991.98px) {
            .illustration-col { display: none; }
            .form-col { padding: 3rem 2rem; }
            .welcome-title { font-size: 2.25rem; }
            .welcome-subtitle { font-size: 2.1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="row g-0">
                <!-- Left Vector Illustration Column -->
                <div class="col-lg-6 illustration-col">
                    <img src="/admin/login_mockup.png" alt="LocationSpoofer Admin Login Illustration" class="illustration-img">
                </div>

                <!-- Right Login Form Column -->
                <div class="col-lg-6 form-col">
                    <h1 class="welcome-title">Hello,</h1>
                    <h2 class="welcome-subtitle">Welcome back</h2>

                    <div class="brand-badge">
                        <span class="lock-icon">🔒</span> LocationSpoofer Admin
                    </div>

                    <div id="alertBox" class="alert alert-danger d-none rounded-3" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username or Email</label>
                            <input type="text" id="username" class="form-control custom-input" placeholder="Username or Email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="password" class="form-control custom-input" placeholder="Password" required>
                                <span class="password-toggle" id="togglePassword">
                                    <i class="bi bi-eye-slash" id="toggleIcon"></i>
                                </span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="forgot-link" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-login w-100">Login to VPS Control</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark">🔑 Forgot Admin Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Enter your registered Admin Email address. We will send an SMTP reset link to recover your account.</p>
                    <div id="modalAlertBox" class="alert d-none rounded-3" role="alert"></div>
                    <form id="forgotPasswordForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Admin Email</label>
                            <input type="email" id="resetEmail" class="form-control custom-input" required placeholder="admin@locationsofi.com" value="admin@locationsofi.com">
                        </div>
                        <button type="submit" class="btn btn-primary btn-login w-100" id="sendResetBtn">Send Reset Link via SMTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password Visibility Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            if (type === 'text') {
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            } else {
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            }
        });

        // Admin Login Handling
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.add('d-none');
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('admin_token', data.token);
                    window.location.href = '/admin/dashboard';
                } else {
                    alertBox.innerText = data.error || 'Invalid credentials';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.innerText = 'Connection error. Please try again.';
                alertBox.classList.remove('d-none');
            }
        });

        // Forgot Password SMTP Request
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const modalAlert = document.getElementById('modalAlertBox');
            const btn = document.getElementById('sendResetBtn');
            btn.disabled = true;
            btn.innerText = 'Sending SMTP Email...';
            modalAlert.classList.add('d-none');

            try {
                const res = await fetch('/api/admin/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('resetEmail').value })
                });
                const data = await res.json();
                modalAlert.classList.remove('d-none', 'alert-danger', 'alert-success');
                if (res.ok) {
                    modalAlert.classList.add('alert-success');
                    let msg = data.message;
                    if (data.resetUrl) {
                        msg += `<br><br><a href="${data.resetUrl}" class="alert-link" target="_blank">👉 Click here to Reset Password Now</a>`;
                    }
                    modalAlert.innerHTML = msg;
                } else {
                    modalAlert.classList.add('alert-danger');
                    modalAlert.innerText = data.error || 'Request failed';
                }
            } catch (err) {
                modalAlert.classList.remove('d-none');
                modalAlert.classList.add('alert-danger');
                modalAlert.innerText = 'Connection error';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send Reset Link via SMTP';
            }
        });
    </script>
</body>
</html>
