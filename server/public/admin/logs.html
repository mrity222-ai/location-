<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocationSpoofer - Recent Activity Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f4f6fc;
            color: #1e293b;
            margin: 0;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1.5px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 1.75rem 1.25rem;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 2.25rem;
            padding-left: 0.5rem;
        }
        .sidebar-brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }
        .sidebar-brand-text {
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #2563eb;
            line-height: 1.1;
        }
        .sidebar-brand-sub {
            font-size: 0.825rem;
            font-weight: 600;
            color: #64748b;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .nav-item-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem 1rem;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #64748b;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-item-link:hover {
            background: #f8fafc;
            color: #1e293b;
        }
        .nav-item-link.active {
            background: #eeeffc;
            color: #2563eb;
            font-weight: 700;
        }

        .sidebar-divider {
            height: 1px;
            background: #e2e8f0;
            margin: 1rem 0 1.5rem 0;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 1rem;
        }
        .btn-logout-sidebar {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #64748b;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .btn-logout-sidebar:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        /* Main Content */
        .main-wrapper {
            margin-left: 260px;
            flex: 1;
            padding: 2rem 2.5rem;
            max-width: 1450px;
        }

        .card-custom {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .table {
            color: #1e293b;
            margin-bottom: 0;
        }
        .table thead th {
            background: #f8fafc;
            color: #64748b;
            font-size: 0.775rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1.5px solid #e2e8f0;
            padding: 1rem 1.25rem;
        }
        .table tbody td {
            padding: 1.1rem 1.25rem;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
            font-size: 0.925rem;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="/admin/dashboard" class="sidebar-brand">
            <img src="/admin/logo.png" alt="LocationSpoofer Logo">
            <div class="sidebar-brand-text">
                <span class="sidebar-brand-title">LocationSpoofer</span>
                <span class="sidebar-brand-sub">Admin</span>
            </div>
        </a>

        <div class="nav-menu">
            <a href="/admin/dashboard" class="nav-item-link">
                <i class="bi bi-grid-fill"></i> Dashboard
            </a>
            <a href="/admin/devices" class="nav-item-link">
                <i class="bi bi-phone-fill"></i> Devices
            </a>
            <a href="/admin/logs" class="nav-item-link active">
                <i class="bi bi-journal-text"></i> Activity Logs
            </a>
            <a href="/admin/settings" class="nav-item-link">
                <i class="bi bi-gear-fill"></i> Settings
            </a>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-footer">
            <button class="btn-logout-sidebar" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Wrapper -->
    <main class="main-wrapper">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1">📋 System & Admin Activity Logs</h2>
                <p class="text-muted small mb-0">Audit history of logins, password resets, device approvals, blocks, and location changes.</p>
            </div>
            <div class="d-flex gap-2">
                <input type="text" id="logSearchInput" class="form-control rounded-3" placeholder="🔍 Search activity logs..." style="width: 280px;">
                <button class="btn btn-primary rounded-3 fw-bold px-3" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
            </div>
        </div>

        <div class="card-custom">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>TIMESTAMP</th>
                                <th>ACTION</th>
                                <th>DETAILS</th>
                                <th>PERFORMED BY</th>
                                <th>IP ADDRESS</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody">
                            <tr><td colspan="6" class="text-center py-4 text-muted">Loading activity logs...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/admin/logs.js"></script>
</body>
</html>
