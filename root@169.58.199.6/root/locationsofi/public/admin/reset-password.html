<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocationSpoofer Admin - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 420px;">
        <div class="card p-4 shadow-lg">
            <h3 class="text-center mb-3 text-primary font-monospace">🔑 Reset Admin Password</h3>
            <p class="text-secondary small text-center mb-4">Enter a new secure password for your LocationSpoofer Admin account.</p>
            <div id="alertBox" class="alert d-none" role="alert"></div>
            <form id="resetForm">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" id="newPassword" class="form-control bg-dark text-light border-secondary" required placeholder="Minimum 6 characters">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control bg-dark text-light border-secondary" required placeholder="Re-enter new password">
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="submitBtn">Update Password</button>
            </form>
            <div class="text-center mt-3">
                <a href="/admin" class="text-secondary text-decoration-none small">Back to Login</a>
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('d-none');
            alertBox.classList.add('alert-danger');
            alertBox.innerText = 'Invalid or missing password reset token in URL.';
            document.getElementById('submitBtn').disabled = true;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.add('d-none');

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alertBox.classList.remove('d-none');
                alertBox.classList.add('alert-danger');
                alertBox.innerText = 'Passwords do not match!';
                return;
            }

            try {
                const res = await fetch('/api/admin/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword })
                });
                const data = await res.json();

                alertBox.classList.remove('d-none', 'alert-danger', 'alert-success');
                if (res.ok) {
                    alertBox.classList.add('alert-success');
                    alertBox.innerText = data.message + ' Redirecting to login...';
                    setTimeout(() => { window.location.href = '/admin'; }, 2000);
                } else {
                    alertBox.classList.add('alert-danger');
                    alertBox.innerText = data.error || 'Reset failed';
                }
            } catch (err) {
                alertBox.classList.remove('d-none');
                alertBox.classList.add('alert-danger');
                alertBox.innerText = 'Connection error';
            }
        });
    </script>
</body>
</html>
